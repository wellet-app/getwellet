<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellet</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./base.css">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2311443B'/%3E%3Cpath d='M8 16c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">

  <script>
    (function() {
      var stored = localStorage.getItem('wellet-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: var(--color-bg, #F7F5F0);
      color: var(--color-text, #1a2624);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100dvh;
    }

    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand {
      display: inline-block;
      line-height: 0;
    }

    .brand img {
      height: 32px;
      width: auto;
      display: block;
    }

    .brand .brand-light { display: none; }
    [data-theme="dark"] .brand .brand-dark { display: none; }
    [data-theme="dark"] .brand .brand-light { display: block; }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 4rem;
    }

    .video-frame {
      width: 100%;
      max-width: 1100px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 20px 60px -20px rgba(17, 68, 59, 0.25);
    }

    .video-frame video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
    }

    .footer {
      padding: 1.25rem 2rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--color-muted, #5a6361);
    }

    .footer a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
    }

    @media (max-width: 640px) {
      .topbar { padding: 1.25rem 1.25rem; }
      .main { padding: 1rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a href="/" class="brand" aria-label="Wellet">
        <img class="brand-dark" src="/assets/wellet-wordmark.svg" alt="Wellet">
        <img class="brand-light" src="/assets/wellet-wordmark-cream.svg" alt="">
      </a>
    </header>

    <main class="main">
      <div class="video-frame">
        <video
          controls
          playsinline
          preload="metadata"
          src="/assets/wildwood/wellet-preseed-2026.mp4">
          Your browser doesn't support embedded video.
          <a href="/assets/wildwood/wellet-preseed-2026.mp4">Download the video</a>.
        </video>
      </div>
    </main>

    <footer class="footer">
      © Wellet 2026 · <a href="/">getwellet.com</a>
    </footer>
  </div>
</body>
</html>
